# CI for pull requests to main.
# Runs lint, type check and build for each app, a secret scan and a dependency audit.
# No secrets are needed. Do not add any here.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '14'
  NEXT_TELEMETRY_DISABLED: '1'
  HUSKY: '0'
  HUSKY_SKIP_INSTALL: '1'

jobs:
  app:
    name: app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: app/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
        # Fails today: stylelint finds no files for the unquoted "**/*.css" glob,
        # and prettier reports many unformatted files. Remove when fixed.
        continue-on-error: true
      - name: Build
        run: yarn build
        env:
          # Public, non-secret values for a test build. Same as docker-compose.yml.
          NEXT_PUBLIC_API: http://localhost:1337
          NEXT_PUBLIC_TENANT: continuum
          NEXT_PUBLIC_TITLE: Coder Trove Cyber
          NEXT_PUBLIC_DESCRIPTION: Coder Trove Cyber
          NEXT_PUBLIC_SECURITY_IMAGE_URL: images/svg/illustrations/illustration-14.svg

  admin:
    name: admin
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: admin/yarn.lock
      - name: Install
        # --ignore-scripts skips the "prepare" script (husky install). Husky 7
        # fails because .git is in the repo root, not in admin/, and it ignores
        # HUSKY=0. No dependency needs its install script: the only ones
        # (fontawesome, core-js) just print messages.
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: yarn lint
        # Fails today: eslint finds no files (.eslintignore ignores *.js and
        # eslint 7 does not check .ts/.tsx by default), and stylelint and
        # prettier report many problems. Remove when fixed.
        continue-on-error: true
      - name: Type check
        run: yarn typeCheck
      - name: Build
        run: yarn build
        env:
          # Public, non-secret values for a test build. Same as docker-compose.yml.
          NEXTAUTH_URL: http://localhost:3001
          API_URI: http://localhost:1337
          NEXT_PUBLIC_API_URL: http://localhost:1337
          NEXT_PUBLIC_INTERNAL_API_URL: http://localhost:1337
          NEXT_PUBLIC_TENANT: continuum
          NEXT_PUBLIC_TITLE: Coder Trove Cyber Admin
          NEXT_PUBLIC_DESCRIPTION: Coder Trove Cyber Admin

  api:
    name: api
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: api/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
        env:
          NODE_ENV: production
          # Without URL, the Strapi config falls back to an old Continuum URL.
          URL: http://localhost:1337

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: Scan commits in this pull request
        run: |
          gitleaks git . --no-banner --redact --verbose \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  deps:
    name: deps (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dir: [app, admin, api]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: yarn audit (report only)
        # Report only for now. There are many known vulnerabilities in the old stack.
        # Make this blocking once the dependencies are upgraded.
        run: |
          if ! yarn audit --groups dependencies; then
            echo "::warning title=yarn audit (${{ matrix.dir }})::Vulnerabilities found. See the job log."
          fi
